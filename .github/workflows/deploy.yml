name: Deploy to EC2

# main par push hote hi backend update ho jaata hai.
#
# ⚠️ Ye tabhi chalega jab EC2 ka security group GitHub ke runner se SSH
# allow kare. Runner ka IP har baar badalta hai, isliye "My IP" wali
# setting isse block kar degi — deploy/README.md me dono raaste likhe hain.
on:
  push:
    branches: [main]
  # Haath se chalane ke liye — Actions tab me "Run workflow".
  workflow_dispatch:

# Do push jaldi-jaldi hue to pehla deploy beech me hi ruk jaaye, warna
# dono ek saath build karenge aur server ki RAM khatam ho jaayegi.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Server par build hota hai, yahan nahi — isliye code checkout karne
      # ki zaroorat hi nahi. Ye step sirf SSH chalata hai.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 8m
          script: |
            cd /var/www/boltirakhi-backend
            bash deploy/deploy.sh
