# /etc/nginx/sites-available/boltirakhi-api
#
# EC2 par ab sirf backend chalta hai. Admin aur public site Amplify par
# jaayenge, isliye yahan ek hi server block hai.
#
# Node 127.0.0.1:5000 par sunta hai — bahar se sirf nginx dikhta hai. Isiliye
# security group me 5000 kabhi nahi kholna.
#
# certbot chalane par ye file khud badal jaayegi (443 block + redirect add
# honge). Usse ladna mat.

upstream boltirakhi_api {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80;
    server_name api.boltirakhi.com;

    # Bolti ki video 50 MB tak ja sakti hai. nginx ka default 1 MB har bade
    # upload ko 413 de deta, aur wo error backend tak pahunchta hi nahi —
    # logs me kuch nahi dikhta.
    client_max_body_size 60M;

    # Server ka version chhupao — ek kam cheez jo attacker ko pata chale.
    server_tokens off;

    location / {
        proxy_pass http://boltirakhi_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Backend `trust proxy` par hai. Iske bina req.ip nginx ka hoga aur
        # har client ek hi rate-limit bucket me gir jaayega — matlab ek
        # customer poore site ko rate-limit karwa sakta hai.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Shiprocket jaisi bahar ki call 10s le sakti hai.
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Health check ke logs se access log bhar jaata hai.
    location = /api/health {
        proxy_pass http://boltirakhi_api;
        proxy_set_header Host $host;
        access_log off;
    }
}
